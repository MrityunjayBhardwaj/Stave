# Install from the lockfile, build the app (which builds the editor and the docs
# and typechecks the shipped code), then both unit suites.
#
# Two depths, one job:
# - On a pull request, the app suite skips `tests/parity-corpus/`. Those 51
#   files run against the Strudel corpus and are nearly all of the suite's 37
#   minutes here; the other 112 files take seconds. This is the check a PR
#   waits on.
# - On every push to main, every night, and on demand, the full suite runs,
#   corpus included, so a corpus regression is caught within a merge or a day.
#   The corpus can come back to every PR once it is fast (#2034).
#
# Not here yet, on purpose:
# - `tsc --noEmit` over the editor's test files: 63 errors on main, all in tests (#2124).
#   The app's tests do typecheck, in their own step below: `next build` checks
#   only the shipped code (tsconfig.build.json, #2381).
# - The browser suite: 279 Playwright spec files (about 1,000 tests) needing a dev
#   server and real audio; it stays a manual gate for now. One file is the
#   exception: tests/gallery-sandbox.spec.ts runs here, in its own job on a
#   production build, because `next dev` can't host the gallery's sandboxed
#   preview frame, so the manual gate skips most of it (#2343). The job also runs
#   tests/start-screen-intro.spec.ts, the last embed the app's frame policy lists
#   whose test lives elsewhere (#2374).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR replaces the older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ github.event_name == 'pull_request' && 'Build and unit tests' || 'Build and full unit suite' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 60 }}
    steps:
      # Full history, so origin/main exists: the modelling ratchet and the
      # code-view boundary tests check that their lists only shrink against it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The active LTS. Each app test gets fresh storage (vitest.setup.ts), so
          # the suites pass on 22, 24 and 25 alike (#2126).
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@stave/app

      # The build checks only the shipped code (tsconfig.build.json); this checks
      # everything in tsconfig.json, tests included, from a clean install (#2381).
      - name: Type-check the app, tests included
        run: pnpm --filter @stave/app exec tsc --noEmit -p . --incremental false

      - name: Editor unit tests
        run: pnpm --filter @stave/editor test

      # `run test`, not `test`: pnpm's own `test` command rejects `--exclude`.
      - name: App unit tests (without the corpus)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @stave/app run test --exclude 'tests/parity-corpus/**'

      - name: App unit tests
        if: github.event_name != 'pull_request'
        run: pnpm --filter @stave/app test

  # #2343 — the gallery preview's browser tests, on a production build (next dev
  # can't host the preview's sandboxed frame). They serve their gallery entries
  # themselves, so no database and no sign-in: a plain `next start`. Its own job,
  # pinned to Ubuntu 24.04: Playwright's Chromium doesn't install on the newer
  # image `ubuntu-latest` now points at, and the unit tests above stay where they are.
  gallery-preview:
    name: Gallery preview browser tests (production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@stave/app

      - name: Install Chromium
        run: pnpm --filter @stave/app exec playwright install --with-deps chromium

      - name: Gallery preview tests
        working-directory: packages/app
        env:
          AUTH_SECRET: ci-only-secret-for-the-gallery-preview-tests
          STAVE_E2E_PORT: "3359"
        run: |
          npx next start -p 3359 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3359/ && break; sleep 2; done
          npx playwright test tests/gallery-sandbox.spec.ts tests/start-screen-intro.spec.ts --project=chromium --workers=1 --reporter=line || {
            echo "--- next start log ---"; cat "$RUNNER_TEMP/next-start.log"; exit 1;
          }
